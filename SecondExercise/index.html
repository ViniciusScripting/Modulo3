<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .box{
            border: 2px solid #b8c7d1;
            text-align: center;
        }

        .row{
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row g-3">
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
        <div class="col box">1</div>
    </div>

    <div class="row g-3">
        <div class="col-2 box">2</div>
        <div class="col-2 box">2</div>
        <div class="col-2 box">2</div>
        <div class="col-2 box">2</div>
        <div class="col-2 box">2</div>
        <div class="col-2 box">2</div>
    </div>

    <div class="row g-3">
        <div class="col-3 box">3</div>
        <div class="col-3 box">3</div>
        <div class="col-3 box">3</div>
        <div class="col-3 box">3</div>
    </div>

    <div class="row g-3">
        <div class="col-4 box">4</div>
        <div class="col-4 box">4</div>
        <div class="col-4 box">4</div>
    </div>

    <div class="row g-3">
        <div class="col-6 box">6</div>
        <div class="col-6 box">6</div>
    </div>

    <div class="row g-3">
        <div class="col-4 box">4</div>
        <div class="col-8 box">8</div>
    </div>

    <div class="row">
        <div class="col-12 box">12</div>
    </div>

</div>

</body>
</html>
